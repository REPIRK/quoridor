        <rect x="102" y="102" width="76" height="76" rx="9" />
        <rect x="190" y="102" width="76" height="76" rx="9" />
        <rect x="278" y="102" width="76" height="76" rx="9" />
        <rect x="102" y="190" width="76" height="76" rx="9" />
        <rect x="190" y="190" width="76" height="76" rx="9" />
        <rect x="278" y="190" width="76" height="76" rx="9" />
        <rect x="102" y="278" width="76" height="76" rx="9" />
        <rect x="190" y="278" width="76" height="76" rx="9" />
        <rect x="278" y="278" width="76" height="76" rx="9" />
    </g>

    <circle cx="228" cy="228" r="27" fill="#6baaa6" />
    <rect x="267" y="102" width="10" height="164" rx="5" fill="#d96c4a" />

