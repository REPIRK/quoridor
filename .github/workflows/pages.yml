name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-uploaded site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      # Nothing reaches the public site that has not passed the rules and engine checks,
      # which is the rule release.yml has always followed for the .exe. This runs here
      # rather than as a dependency on the build workflow because a `workflow_run`
      # trigger reads its definition from the default branch and hands the job a commit
      # it then has to go and check out by hand — two moving parts in place of one step.
      # It also runs before the toolchain and the publish rather than after: a failure
      # then costs seconds instead of the several minutes AOT takes.
      - name: Rules and engine checks
        run: dotnet run --project tests/Quoridor.Selftest -c Release

      # Ahead-of-time compilation. Interpreted WebAssembly costs the engine three
      # plies, which is the difference between a sparring partner and a pushover.
      # This step is why the job takes minutes rather than seconds.
      #
      # "restore" rather than "install wasm-tools": the workload is versioned per
      # target framework, so naming it directly installs the wrong one whenever the
      # runner's default SDK is newer than the framework the project targets.
      - name: Install the WebAssembly toolchain
        run: dotnet workload restore src/Quoridor.Web/Quoridor.Web.csproj

      - name: Publish
        run: dotnet publish src/Quoridor.Web -c Release -o published

      # GitHub Pages serves a project site from /<repository>/, so the base href the
      # app was built with has to be rewritten to match.
      - name: Point the app at its subdirectory
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|g' published/wwwroot/index.html

          # Blazor fingerprints its own files, but the stylesheet is referenced by hand
          # and browsers hold on to it. Stamping the commit onto the link means a deploy
          # is picked up at once instead of whenever the cache happens to expire.
          sed -i 's|href="css/app.css"|href="css/app.css?v=${{ github.sha }}"|g' published/wwwroot/index.html

          touch published/wwwroot/.nojekyll
          cp published/wwwroot/index.html published/wwwroot/404.html

      # Turns Pages on if it is not already, rather than assuming someone has been
      # into the settings. Without this the site cannot come back by itself after the
      # repository is recreated — the deploy step would fail on a repository that has
      # never had Pages enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: published/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
